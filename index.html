button{cursor:pointer;text-align:left}

label{display:block;margin-top:8px;color:var(--mut);font-size:.9rem}
.hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.95rem}
.hd b{color:var(--gold)}
.bar{display:grid;grid-template-columns:78px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;margin:3px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}
.bar s{display:block;height:8px;border-radius:4px;background:var(--bd);text-decoration:none}
.mut{color:var(--mut);font-size:.88rem}
.fx{color:var(--gold);font-weight:bold;margin:8px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}.mem{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:.82rem}.nem{border-color:var(--ac)}summary{cursor:pointer;font-weight:bold}
.arena{position:relative;height:210px;border-radius:12px;overflow:hidden;background:linear-gradient(#7ec8f0 55%,#1c6fa8 55%);border:1px solid var(--bd)}
.arena:before{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,#ffffff30 0 14px,transparent 14px 40px);animation:wv 3s linear infinite}
@keyframes wv{to{background-position:80px 0}}
.fi{position:absolute;bottom:26px;width:80px;height:120px;transition:transform .25s;animation:bob 1.6s ease-in-out infinite}
.fi.p{left:12%}.fi.e{right:12%;transform:scaleX(-1)}
@keyframes bob{50%{margin-bottom:6px}}
.fi.p.atk{transform:translateX(min(36vw,240px)) rotate(10deg)}.fi.e.atk{transform:scaleX(-1) translateX(min(36vw,240px)) rotate(10deg)}
.fi.hit{animation:shk .3s,fl .3s}
@keyframes shk{25%{margin-left:-8px}75%{margin-left:8px}}
@keyframes fl{50%{filter:brightness(2.5) saturate(0)}}
.dmg{position:absolute;top:40px;font:bold 24px Georgia,serif;color:#ff3b30;text-shadow:0 0 3px #000;animation:up .9s forwards}
@keyframes up{to{transform:translateY(-45px);opacity:0}}
.bt{display:flex;gap:12px}.bt>div{flex:1}
.tag{display:inline-block;border:1px solid var(--gold);border-radius:99px;padding:1px 9px;margin:2px;font-size:.8rem}

{i:'🌍',l:'Rejoindre le conflit',d:'Un grand conflit secoue le monde',ok:()=>S.wa&&!S.wa.side&&S.sea>=WA[S.wa.i].min,ev:()=>callEv()},
{i:'🏴',l:'Équipage légendaire',d:'Rencontrer une légende des mers',ok:()=>S.sea>0,ev:legends},
{i:'😈',l:'Traquer ton némésis',d:'Duel à mort',ok:()=>S.nem,ev:duel},
{i:'👑',l:'Défier un Empereur',d:'Nouveau Monde uniquement',ok:()=>S.path==='Pirate'&&S.sea===2&&S.emp.some(e=>!e.dead),ev:empEv},
{i:'🏝️',l:'La dernière île',d:'Tu es le plus fort des quatre',ok:()=>S.path==='Pirate'&&S.seat&&S.emp.every(e=>e.dead)&&S.ship.lv>=4&&S.crew.length>=3,ev:gate},
{i:'🏁',l:'Défi suprême',d:'Le dernier combat',ok:()=>S.path!=='Pirate'&&S.r>=120&&S.age>=25,ev:fin}];
function act(i){CUR=ACT[i].ev();CUR.act=1;render()}
function hostile(){const n={Pirate:'Des chasseurs de primes',Marine:'Des pirates audacieux',Révolutionnaire:'Des agents du Gouvernement'}[S.path];
 return{t:n+' te tendent un piège',d:'Ils sont organisés et armés.',ch:[D('Se battre','F',eb(1),'capture',{r:4,b:S.path==='Marine'?0:15},{w:{fx:{r:4,b:S.path==='Marine'?0:15},t:'Tu les écrases.'},x:{fx:{r:-2},t:'Ils te submergent.'}}),D('Fuir en mer','V',eb(.8),'capture',{},{w:{fx:{},t:'Tu leur échappes.'},x:{t:'Ils te rattrapent.'}}),D('Ruse tactique','I',eb(1.1),'capture',{r:6},{w:{fx:{r:6},t:'Piège retourné contre eux !'}})]}}
function admiral(){const E=Math.round([34,56,70][S.sea]+S.age*1.1+(S.wf||0)),nm=S.sea===2?'Amiral':'Vice-amiral';
 return{t:`⚓ Un ${nm} te barre la route`,d:`Un officier d'élite et sa flotte te rattrapent. Il peut te tuer.`,ch:[D('Combattre','F',E,'mort',{r:30,b:100},{d0:`tué par un ${nm} de la Marine`,w:{fx:{r:30,b:100,ht:10},t:'Impossible... tu as vaincu un officier de ce rang !'},x:{t:'Il te terrasse sans effort.'}}),D('Fuir en mer','V',Math.round(E*.75),'mort',{},{d0:`abattu par un ${nm} en fuite`,w:{fx:{ht:-10},t:'Tu disparais dans la brume.'},x:{t:'Sa flotte te rattrape.'}}),...(S.crew.length?[{l:'Sacrifier un compagnon pour fuir',fx:{cr:-1,ht:-10,r:-5}}]:[]),{l:'Te rendre',fx:{pr:R(3,6),b:30}}]}}
function monster(){const E=eb(S.sea===2?2:1.5);return{t:'Monstre des profondeurs',d:'Un colosse émerge des flots.',ch:[D('Le combattre','F',E,'mort',{r:12,F:1,b:60},{w:{fx:{r:12,F:1,b:60},t:'Tu abats la bête !'},x:{fx:{h:-25},t:'Elle fracasse ton navire.'}}),D('Bordée de canons','S',E,'blessure',{r:10,b:40},{w:{fx:{r:10,b:40},t:'Les canons font mouche.'},x:{fx:{h:-30},t:'Elle broie ta coque.'}}),D('Fuir','V',Math.round(E*.7),'blessure',{},{w:{fx:{},t:'Tu la sèmes.'},x:{fx:{h:-20},t:'Elle te mord les talons.'}})]}}
function storm(){return{t:'Tempête',d:'Un ciel noir, des vagues hautes comme des falaises.',ch:[{l:'Affronter la tempête',k:'I',rb:'Navigateur',df:11,w:{fx:{H:1,r:3},t:'Ton sang-froid sauve le navire.'},x:{fx:{hp:-15,h:-20},t:'Le navire souffre, toi aussi.'}},{l:'Contourner (long détour)',fx:{h:-8,I:1}}]}}
function sick(){return{t:'Fièvre à bord',d:'Une maladie se répand.',ch:[{l:'Soigner (le médecin aide)',k:'I',rb:'Médecin',df:10,w:{fx:{I:1},t:'Guérison rapide.'},x:{fx:{hp:-20,cr:-1},t:'La maladie fait des ravages.'}},{l:'Serrer les dents',fx:{hp:-10}}]}}
function betray(){return{t:'Trahison à bord',d:`Un membre de l'équipage est soupçonné d'avoir vendu des informations.`,ch:[{l:'Lui pardonner',k:'I',df:10,w:{fx:{r:3},t:`Il était manipulé. Sa loyauté n'en est que plus forte.`},x:{fx:{cr:-1,r:-2,ht:15},t:'Il disparaît en livrant ta position...'}},{l:'Le chasser',fx:{cr:-1,H:1}}]}}
function empHit(){const e=pick(S.emp.filter(x=>!x.dead)),E=Math.round(e.pw);return{t:`👑 ${e.n} te prend pour cible`,d:`Sa flotte entière a repéré ton pavillon. Puissance estimée ${E}.`,ch:[D('Lui tenir tête','H',E,'mort',{ew:S.emp.indexOf(e)},{d0:'tué par '+e.n,w:{fx:{ew:S.emp.indexOf(e)},t:'Tu terrasses '+e.n+' !'},x:{t:'Il te brise.'}}),D('Fuir','V',Math.round(E*.7),'mort',{},{d0:'rattrapé par '+e.n,w:{fx:{},t:'Tu lui échappes de justesse.'}}),{l:'Offrir un tribut',fx:{b:-150,r:-5,cr:-1}}]}}
function PRI(){const E=eb(1.4);return{t:`⛓️ En prison (${S.prison} saisons)`,d:S.sea>0?'Impel Down : des cachots à perte de vue, des gardiens impitoyables.':'Les gardes sont nombreux et les murs épais.',ch:[{l:`Tenter l'évasion`,k:'V',df:15,w:{fx:{pr:0,ht:15,V:1},t:`Tu t'évades dans la nuit !`},x:{fx:{hp:-25,pr:2},t:'Rattrapé et passé à tabac.'}},{l:'Attendre en silence',fx:{pr:-1,hp:5,r:-2},rk:S.b>=800?.12:0,rkfx:{dx:'exécuté publiquement'}},...(S.crew.length>1?[D("Faire donner l'équipage",'S',E,'blessure',{pr:0,r:8,ht:20},{w:{fx:{pr:0,r:8,ht:20},t:'Tes compagnons forcent les portes !'},x:{fx:{cr:-1,pr:1},t:`L'assaut échoue, un compagnon est capturé.`}})]:[])]}}
function fruit(){const r=Math.random(),P=['Miroir','Lames','Sable Chantant','Ombres'];if(r<.004)return['Fruit du Phénix (Zoan Mythique)',{F:4,H:3,V:3}];if(r<.04)return['Fruit de la Foudre (Logia)',{V:5,F:3,H:2}];if(r<.22)return['Fruit du Loup Spectral (Zoan)',{F:4,V:2}];return['Fruit du '+pick(P)+' (Paramecia)',{I:2,H:1,F:2}]}
function rare(){const x=p=>Math.random()<p*(1+S.st.C/40);
 if(!S.fruit&&x(.006)){const[n,f]=fruit2();f.fr=n;return{rare:1,t:'🍎 UN FRUIT DU DÉMON !',d:'Un fruit aux motifs en spirale, au goût atroce. Tu ne pourras plus jamais nager.',ch:[{l:'Incroyable !',fx:f}]}}
 if(!S.traits.includes('Haki des Rois')&&x(.003))return{rare:1,t:'👑 HAKI DES ROIS',d:`Un silence : des hommes s'évanouissent autour de toi.`,ch:[{l:'Accepter ce pouvoir',fx:{H:6,tr:'Haki des Rois',r:10}}]};
 if(x(.0025))return{rare:1,t:'🏴 UN MENTOR LÉGENDAIRE',d:'Une légende des mers te prend sous son aile.',ch:[{l:'Te dépasser',fx:{F:3,V:3,H:3,I:3,r:8}}]};
 if(!S.traits.includes('Arme légendaire')&&x(.002))return{rare:1,t:'⚔️ ARME LÉGENDAIRE',d:'Une arme de grade suprême te choisit.',ch:[{l:'La saisir',fx:{F:4,tr:'Arme légendaire',b:40}}]};
 if(x(.004))return{rare:1,t:'🍀 BÉNÉDICTION DE LA CHANCE',d:'Un banc de poissons dorés suit ton navire.',ch:[{l:'Remercier la mer',fx:{C:5}}]};return null}
function incident(){if(S.path!=='Marine'&&S.title!=='Corsaire'&&S.sea>0&&Math.random()<S.heat/(S.sea===1?130:90))return admiral();
 const c=[storm,sick,hostile];if(S.sea>0)c.push(monster);if(S.crew.length)c.push(betray);if(S.nem)c.push(duel);
 if(S.sea===2&&S.b>=1000&&!S.seat&&S.emp.some(e=>!e.dead))c.push(empHit);return pick(c)()}
function gen(){if(S.prison>0)return PRI();if(S.wa&&!S.wa.called&&callable())return callEv();const r=rare();if(r)return r;if(Math.random()<.4)return incident();return{hub:1}}
function next(){S.nw='';S.q++;if(S.wa&&--S.wa.left<=0)worldEnd();if(!S.wa&&S.age>=17&&Math.random()<.07)startWorld();if(S.q>3){S.q=0;S.age++;S.emp.forEach(e=>{if(!e.dead)e.pw+=1.6});if(S.nem)S.nem.pw+=1.5;if(S.title==='Corsaire')S.r+=5;const a=arc();if(a!==S.arc){S.arc=a;log('📖 Nouveau chapitre : '+a)}}
 S.heat=cl(S.heat-2,0,100);S.hp=cl(S.hp+(S.prison?2:6),0,100);if(S.age>=50)return finish(false);
 if(!S.nem&&S.age>=18&&S.age>=(S.nt||0)&&Math.random()<.2)mkNem();save();CUR=gen();RES=null;render()}
function finish(win){S.over=1;S.win=win;save();RES=null;render()}
function start(){const n=$('nm').value.trim()||'Inconnu',i=$('is').value,s=$('sy').value,p=$('pa').value,st={F:3,V:3,H:3,I:3,C:3};for(const k in st)st[k]+=(ISLES[i][k]||0)+(STYLES[s][k]||0);
 S={name:n,isle:i,style:s,path:p,age:15,q:0,st,b:0,r:0,crew:[],fruit:null,traits:[],log:[],arc:'Les Premiers Pas',ship:{n:p==='Marine'?'Navire de garnison':'Le '+pick(['Aube Dorée','Albatros','Vent Rouge','Ancre Brisée']),lv:1,h:90},nem:null,title:'',hp:100,prison:0,heat:0,sea:0,emp:mkEmp(),seat:0,ally:[],loc:null};
 if(Math.random()<.01){for(const k in st)st[k]+=3;S.traits.push('Descendant de légende')}
 log('Début de ton aventure à '+i);save();CUR=gen();RES=null;render()}
function menu(){S=null;load();let h='<h1>🏴‍☠️ One Story</h1><p class="mut" style="text-align:center">Fan game — une mer cruelle, peu de légendes. Forge la tienne.</p>';
 h+='<div class="card"><b>Nouveau personnage</b><label>Nom</label><input id="nm" maxlength="20" placeholder="Ton pirate...">';
 const sel=(id,l,o)=>`<label>${l}</label><select id="${id}">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
 h+=sel('is','Île natale',Object.keys(ISLES))+sel('sy','Style de combat',Object.keys(STYLES))+sel('pa','Voie',Object.keys(PATHS))+'<button class="pri" onclick="start()">Lever l\'ancre ⚓</button></div>';
 if(saves.length)h+='<div class="card"><b>Tes personnages</b>'+saves.map((c,i)=>`<button onclick="S=mig(saves[${i}]);CUR=S.over?null:gen();RES=null;render()">${esc(c.name)} — ${esc(c.path)}, ${c.age} ans${c.over?(c.dead?' ☠️':' (terminé)'):''}</button>`).join('')+'</div>';
 $('app').innerHTML=h}
function render(){if(!S)return menu();if(B)return drawB();
 const bar=(l,v,m,c)=>`<div class="bar"><span>${l}</span><s><i style="width:${Math.min(100,v/m*100)}%${c?';background:'+c:''}"></i></s><b>${Math.round(v)}</b></div>`;
 let h=`<h1>${esc(S.name)}</h1><div class="card"><div class="hd"><span>${esc(rk())} · <b>${esc(S.path)}</b></span><span>${S.age} ans · ${SEA[S.q]}</span></div><div class="hd mut"><span>📍 ${esc(S.loc||RG[S.sea])} (${RG[S.sea]}) · ${esc(S.arc)}</span><span>${esc(S.isle)} · ${esc(S.style)}</span></div><div class="hd"><span>Prime : <b>${fmt(S.b)}</b></span><span>Réputation : <b>${S.r}</b></span><span>Puissance : <b>${pw()}</b></span></div>`+Object.keys(ST).map(k=>bar(ST[k],S.st[k],30)).join('')+bar('Santé',S.hp,100,'#3c9d4e')+(S.path!=='Marine'?bar('Recherché',S.heat,100,'#c77d00'):'');
 h+=(S.fruit?`<span class="tag">🍎 ${esc(S.fruit)}</span>`:'')+S.traits.map(t=>`<span class="tag">✨ ${esc(t)}</span>`).join('')+S.ally.map(a=>`<span class="tag">🤝 ${esc(a)}</span>`).join('')+(S.prison>0?'<span class="tag">⛓️ En prison</span>':'')+'</div>';
 h+=`<details class="card"><summary>🚢 ${esc(S.ship.n)} — ${SHN[S.ship.lv-1]}</summary>${bar('Coque',S.ship.h,hm())}<div class="mut">Niveau ${S.ship.lv}/5 · Canons : ${S.ship.lv*4} · Équipage max : ${cap()}</div></details>`;
 h+=`<details class="card"><summary>👥 Équipage (${S.crew.length}/${cap()})</summary><div class="g2">${S.crew.length?S.crew.map(m=>`<div class="mem"><b>${esc(m.n)}</b><br>${esc(m.role)} · niv. ${m.lv}<br><span class="mut">${PK[m.role]}</span></div>`).join(''):'<span class="mut">Personne à bord.</span>'}</div></details>`;
 if(S.path==='Pirate')h+=`<details class="card"><summary>👑 Les Quatre Empereurs${S.seat?' (tu es Empereur)':''}</summary>${S.emp.map(e=>`<div class="mut">${e.dead?'☠️ '+esc(e.n)+' — vaincu':esc(e.n)+' — '+lvl(pw()/e.pw)}</div>`).join('')}</details>`;
 if(S.nem)h+=`<div class="card nem"><b>⚔️ Némésis : ${esc(S.nem.n)}</b><div class="mut">Style ${esc(S.nem.s)} · ${lvl(pw()/S.nem.pw)} · duels : ${S.nem.w} V / ${S.nem.l} D</div></div>`;
 if(S.wa)h+=`<div class="card nem"><b>🌍 ${esc(WA[S.wa.i].n)}</b><div class="mut">${esc(WA[S.wa.i].d)} (${S.wa.left} saisons restantes)</div></div>`;if(S.nw&&!S.wa)h+=`<div class="card rare">${esc(S.nw)}</div>`;
 if(S.over){h+=`<div class="card rare"><h2>${S.win?'👑 '+esc(WIN[S.path])+' !':S.dead?'☠️ Fin de carrière':'Fin de ton aventure'}</h2><p>${S.win?`Tu as accompli le rêve ultime. Ton nom est gravé dans l'histoire.`:S.dead?`À ${S.age} ans, tu es ${esc(S.dead)}. Rang atteint : <b>${esc(rk())}</b>, prime ${fmt(S.b)}.`:`À 50 ans, tu prends ta retraite avec le rang de <b>${esc(rk())}</b>, une prime de ${fmt(S.b)} et ${S.crew.length} compagnons.`}</p><button class="pri" onclick="menu()">Retour au menu</button></div>`}
 else if(RES)h+=`<div class="card"><h3>${esc(CUR.t||'')}</h3><p>${esc(RES.txt)}</p>${RES.res?`<div class="fx">${esc(RES.res)}</div>`:''}<button class="pri" onclick="next()">Saison suivante ▶</button></div>`;
 else if(CUR.hub)h+=`<div class="card"><h3>Que fais-tu cette saison ?</h3><div class="g2">${ACT.map((a,i)=>(!a.ok||a.ok())?`<button onclick="act(${i})">${a.i} <b>${a.l}</b><br><span class="mut">${a.d}</span></button>`:'').join('')}</div></div>`;
 else h+=`<div class="card${CUR.rare?' rare':''}"><h3>${esc(CUR.t)}</h3><p>${esc(CUR.d)}</p>${CUR.ch.map((c,i)=>`<button ${c.lock?'disabled':''} onclick="choose(${i})">${esc(c.l)} <span class="mut">${c.E?lvl(Pe(c)/c.E):c.k?'('+(ST[c.k]||'Navire')+')':''}</span></button>`).join('')}${CUR.act?`<button onclick="CUR={hub:1};render()">↩ Changer d'idée</button>`:''}</div>`;
 h+=`<div class="card"><b>Journal</b>${S.log.slice(0,8).map(l=>`<div class="mut">${esc(l)}</div>`).join('')}</div><button onclick="menu()">☰ Menu (sauvegarde auto)</button>`;
 $('app').innerHTML=h}
menu();

</script></body></html>
